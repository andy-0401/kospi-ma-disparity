# Netlify 설정 — 정적 사이트(docs/)를 루트로 서빙. 빌드 단계 없음.
# 깃 푸시(스케줄 데이터 커밋 포함)마다 자동 재배포 → 자동 업데이트 그대로 유지.
[build]
  publish = "docs"
  command = ""

# 예약 함수: 매 거래일 12:00·15:40 KST 정시에 GitHub 워크플로를 트리거(정시성 확보).
# 함수 코드의 export const config.schedule 로 cron 이 등록됨. 환경변수 GH_DISPATCH_TOKEN 필요.
[functions]
  directory = "netlify/functions"
