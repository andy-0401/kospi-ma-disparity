# netlify.app 은 이제 '리다이렉트 전용'이다.
#   실제 사이트는 무료 GitHub Pages 가 서빙(빌드·함수·대역폭 무료) → Netlify 크레딧 절약.
#   이미 공유된 https://kospi-ma.netlify.app 링크는 그대로 살아서 Pages 로 넘어간다.

[build]
  publish = "docs"
  command = ""
  # 데이터 커밋마다 재빌드(=크레딧 소모)하지 않도록, netlify.toml 이 바뀔 때만 빌드.
  #   (리다이렉트 규칙은 거의 안 바뀌므로 사실상 빌드가 멈춘다.)
  ignore = "git diff --quiet HEAD^ HEAD -- netlify.toml"

# 모든 경로를 동일 경로의 GitHub Pages 로 전달(임시 302 — 추후 되돌리기 쉬움).
[[redirects]]
  from = "/*"
  to = "https://andy-0401.github.io/kospi-ma-disparity/:splat"
  status = 302
  force = true
