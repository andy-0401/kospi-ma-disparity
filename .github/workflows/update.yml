name: 코스피 50일 이격도 갱신

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. KST = UTC+9.
    # ※ 무료 티어 cron 은 정시 보장이 안 되고 정각(:00)이 가장 혼잡 → 정각 회피 + 시점별 다중 시도.
    #   파이프라인이 멱등(무변경=빈커밋 차단, 종가는 동일값 no-op)이라 중복 실행 안전.
    # 장중(intraday) ≈ 12:00 KST = 03:xx UTC
    - cron: "7 3 * * 1-5"    # 12:07 KST — 장중 1차
    - cron: "20 3 * * 1-5"   # 12:20 KST — 장중 백업
    # 종가(close) ≈ 15:40 KST = 06~07:xx UTC (장 마감 15:30 이후라 동일 종가 → 백업은 no-op)
    - cron: "42 6 * * 1-5"   # 15:42 KST — 종가 1차
    - cron: "57 6 * * 1-5"   # 15:57 KST — 종가 백업
    - cron: "12 7 * * 1-5"   # 16:12 KST — 종가 백업2
  # 외부 스케줄러(cron-job.org 등)가 정시에 호출 → GitHub cron 지연 우회.
  #   POST /repos/{owner}/{repo}/dispatches  body: {"event_type":"intraday"|"close"}
  repository_dispatch:
    types: [intraday, close]
  workflow_dispatch:
    inputs:
      type:
        description: "갱신 유형"
        type: choice
        default: close
        options: [close, intraday]
      force:
        description: "비거래일에도 강제 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: disparity-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Determine run type
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.type }}"
            FORCE="${{ inputs.force }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # 외부 스케줄러가 보낸 event_type(intraday|close)을 그대로 사용
            TYPE="${{ github.event.action }}"; FORCE="false"
          else
            # 스케줄 크론의 UTC '시(hour)'로 유형 결정 (지연돼도 크론식은 의도 시각 유지).
            #   03시대 → 장중(intraday), 06~07시대 → 종가(close)
            H=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
            if [ "$H" -ge 6 ]; then TYPE="close"; else TYPE="intraday"; fi
            FORCE="false"
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "선택된 유형: $TYPE (force=$FORCE)"

      - name: Run update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          ARGS="--type ${{ steps.cfg.outputs.type }}"
          if [ "${{ steps.cfg.outputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/run_update.py $ARGS

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json docs/data/latest.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            # 데이터가 실제로 갱신된 경우에만 sitemap lastmod 를 오늘(UTC)로 → 검색엔진 신선도 신호
            if [ -f docs/sitemap.xml ]; then
              sed -i "s#<lastmod>[0-9-]*</lastmod>#<lastmod>$(date -u +%Y-%m-%d)</lastmod>#g" docs/sitemap.xml
              git add docs/sitemap.xml
            fi
            git commit -m "data: ${{ steps.cfg.outputs.type }} 이격도 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git push origin HEAD:${{ github.ref_name }} && break
              echo "push 재시도 $i..."; sleep $((2**i))
            done
          fi
