name: GitHub Pages 배포

# 무료 GitHub Pages 가 실제 사이트를 서빙한다.
# (netlify.app 은 이 주소로 넘겨주는 리다이렉트만 → Netlify 크레딧 거의 0)
#
# 과거 'Pages 가 안 갱신되던' 원인 = 로봇(GITHUB_TOKEN) 이 올린 데이터 커밋이
#   브랜치형 Pages 빌드를 자동으로 깨우지 않는 GitHub 규칙 때문.
#   → 여기서는 '데이터 갱신 워크플로가 끝나면' 그 실행을 받아 Pages 를 직접 게시한다.
on:
  # 데이터 갱신 워크플로가 끝나면(=로봇이 새 종가/장중값 커밋) 곧바로 게시.
  workflow_run:
    workflows: ["코스피 50일 이격도 갱신"]
    types: [completed]
  # main 에 푸시될 때마다 게시(데이터 커밋은 위 workflow_run 이 담당,
  #   여기서는 사람이 직접 올린 변경을 빠짐없이 반영).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 한 번에 하나만.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 데이터 워크플로가 '성공'했을 때만 게시(실패 실행에는 반응하지 않음).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
